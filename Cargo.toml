[package]
name = "ferramentas-cli"
version = "0.1.4"
edition = "2021"
authors = ["Adriano Xavier"]
description = "Ferramentas de linha de comando para o compilador em português"
license = "MIT"

# Nome do executável instalado
[[bin]]
name = "pordosol"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
walkdir = "2.5"
which = "6.0"
path-absolutize = "3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["blocking", "json"] }
zip = "2.1"
tar = "0.4"
flate2 = "1.0"
tempfile = "3.10"

[features]
default = []

[dev-dependencies]
