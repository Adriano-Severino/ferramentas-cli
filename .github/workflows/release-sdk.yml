name: Build and Release SDK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 0.1.0)'
        required: true
        default: '0.1.0'

jobs:
  build-windows:
    name: Build Windows Package
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout compilador-portugues
        uses: actions/checkout@v4
        with:
          repository: Adriano-Severino/compilador-portugues
          path: compilador-portugues

      - name: Checkout sistema-padrao
        uses: actions/checkout@v4
        with:
          repository: Adriano-Severino/sistema-padrao
          path: sistema-padrao

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset -y
          # choco places the WiX bin folder on the *system* PATH. Append it to the
          # GitHub Actions PATH file so the next steps (candle/heat/light) resolve.
          $wixBin = Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14\bin'
          if (Test-Path -LiteralPath $wixBin) {
            Add-Content -LiteralPath $env:GITHUB_PATH -Value $wixBin -Encoding utf8
          }

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Windows Package
        working-directory: ./scripts
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) { $version = "${{ github.ref_name }}" -replace "v", "" }
          .\\build-package.ps1 -Version $version -SkipTests

      - name: Build Windows Installer
        working-directory: ./scripts
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) { $version = "${{ github.ref_name }}" -replace "v", "" }
          .\build-installer.ps1 -Version $version -SkipPackage

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*.zip
            dist/*.msi
            dist/*.sha256

  build-linux:
    name: Build Linux Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout compilador-portugues
        uses: actions/checkout@v4
        with:
          repository: Adriano-Severino/compilador-portugues
          path: compilador-portugues

      - name: Checkout sistema-padrao
        uses: actions/checkout@v4
        with:
          repository: Adriano-Severino/sistema-padrao
          path: sistema-padrao

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Linux Package
        working-directory: ./scripts
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
          fi
          chmod +x build-package.sh
          ./build-package.sh "$version" "" 0 1

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.tar.gz
            dist/*.sha256

  test:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test CLI
        run: cargo test

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: windows-artifacts

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: linux-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-artifacts/*
            linux-artifacts/*
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |
            ## Por do Sol SDK v${{ github.ref_name }}
            
            ### Downloads
            
            #### Windows
            - **Instalador MSI:** `pordosol-sdk-v${{ github.ref_name }}-windows-x64.msi` (Recomendado)
            - **Pacote ZIP:** `pordosol-sdk-v${{ github.ref_name }}-windows-x64.zip`
            
            #### Linux
            - **Pacote TAR.GZ:** `pordosol-sdk-v${{ github.ref_name }}-linux-x64.tar.gz`
            
            ### Verificação de Integridade
            Cada pacote inclui um arquivo `.sha256` com o checksum SHA256 para verificação de integridade.
            
            ### Instalação
            
            Consulte o guia [INSTALACAO.md](https://github.com/Adriano-Severino/ferramentas-cli/blob/main/INSTALACAO.md) para instruções detalhadas.
            
            ### Novidades
            - Implementado `pordosol update` / `pordosol atualizar` para atualização automática do SDK
            - Suporte para substituição em instalações MSI no Windows (`msiexec` em background)
            - Suporte para atualizações em modo portátil extraindo `zip`/`tar.gz` e substituindo a instalação atual (renomeando binários em uso)
            - Centralização de artefatos oficiais pelo repositório do ferramentas-cli
            
            ### Documentação
            - [INSTALACAO.md](https://github.com/Adriano-Severino/ferramentas-cli/blob/main/INSTALACAO.md) - Guia de instalação
            - [PRIMEIROS_PASSOS.md](https://github.com/Adriano-Severino/ferramentas-cli/blob/main/PRIMEIROS_PASSOS.md) - Primeiros passos
            - [SOLUCAO_PROBLEMAS.md](https://github.com/Adriano-Severino/ferramentas-cli/blob/main/SOLUCAO_PROBLEMAS.md) - Solução de problemas
            
            ### Suporte
            Reporte problemas em: https://github.com/Adriano-Severino/ferramentas-cli/issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}